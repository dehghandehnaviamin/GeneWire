[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "genewire"
version = "0.1.0.dev1"
description = "Experimental Rust-backed regional byte streams for Python"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Rust"]

[dependency-groups]
test = ["maturin==1.16.0", "pysam==0.24.1"]

[tool.maturin]
manifest-path = "crates/genewire-python/Cargo.toml"
python-source = "python"
module-name = "genewire._native"
