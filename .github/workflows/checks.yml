name: Local reference checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0, node24
        with:
          version: '0.13.10'
      - name: Select the evaluated Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - name: Native checks
        run: |
          cargo +1.93.0 fmt --all -- --check
          cargo +1.93.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.93.0 test --workspace --locked
      - name: Rebuild Python extension and exercise supervised analysis
        env:
          RUSTUP_TOOLCHAIN: '1.93.0'
        run: |
          uv sync --locked --group test --extra analysis --reinstall-package genewire
          .venv/bin/python -m unittest discover -s tests -v
      - name: Recoverable BAM process and storage faults
        run: .venv/bin/python tools/check_recovery.py --report "$RUNNER_TEMP/recovery.json"
      - name: Build pinned independent local server
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/umccr/htsget-rs.git "$RUNNER_TEMP/htsget-rs"
          git -C "$RUNNER_TEMP/htsget-rs" sparse-checkout set htsget-actix htsget-axum htsget-config htsget-http htsget-lambda htsget-search htsget-storage htsget-test
          git -C "$RUNNER_TEMP/htsget-rs" checkout --detach 2a91e661e6a287e3adf30e65c26a8f47697f3548
          CARGO_TARGET_DIR="$RUNNER_TEMP/htsget-build" cargo +1.93.0 build --manifest-path "$RUNNER_TEMP/htsget-rs/Cargo.toml" --locked -p htsget-axum --no-default-features
      - name: Independent interoperability and resource probes
        run: |
          .venv/bin/python tools/check_interop.py --server "$RUNNER_TEMP/htsget-build/debug/htsget-axum" --report "$RUNNER_TEMP/interop.json"
          .venv/bin/python tools/check_resources.py --report "$RUNNER_TEMP/resources.json"
      - name: Retain synthetic evaluation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: evaluation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/interop.json
            ${{ runner.temp }}/resources.json
            ${{ runner.temp }}/recovery.json
          if-no-files-found: ignore
          archive: true
          retention-days: 7
