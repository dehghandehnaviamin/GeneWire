[workspace]
members = ["crates/genewire-core", "crates/genewire-python"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/dehghandehnaviamin/GeneWire"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
httpdate = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = "1"
serde_json = "1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
