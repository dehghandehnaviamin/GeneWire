<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">GeneWire proposed protocol responsibilities</title><desc id="desc">Five proposed layers covering genomic objects, session control, transfer, integrity and durable state, and a transport integration under research.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } path,line { stroke-linecap: round; stroke-linejoin: round; }</style>
<rect x="0" y="0" width="1200" height="660" rx="0" fill="#f3f7f0" stroke="none"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527262"/></marker></defs><text x="40" y="52" font-size="30" fill="#17201d" font-weight="700" >Protocol overview</text><text x="40" y="83" font-size="16" fill="#52665b" font-weight="400" >Logical responsibilities only; the stack does not assign message fields or cryptographic algorithms.</text><rect x="936" y="28" width="224" height="32" rx="6" fill="#e5f3d7" stroke="none"/><text x="1048" y="49" font-size="12" fill="#3e592c" font-weight="700" text-anchor="middle">CONCEPTUAL / PROPOSED</text><rect x="40" y="125" width="1120" height="75" rx="10" fill="#ffffff" stroke="#c6d2c9"/><rect x="56" y="141" width="43" height="43" rx="7" fill="#e5f3d7" stroke="none"/><text x="78" y="169" font-size="17" fill="#365626" font-weight="700" text-anchor="middle">01</text><text x="120" y="154" font-size="21" fill="#17201d" font-weight="700" >Genomic objects</text><text x="120" y="181" font-size="16" fill="#52665b" font-weight="400" >Opaque data first; optional format, reference and index context</text><text x="1138" y="156" font-size="11" fill="#52665b" font-weight="700" text-anchor="end">UNDER RESEARCH</text><rect x="40" y="216" width="1120" height="75" rx="10" fill="#ffffff" stroke="#c6d2c9"/><rect x="56" y="232" width="43" height="43" rx="7" fill="#e5f3d7" stroke="none"/><text x="78" y="260" font-size="17" fill="#365626" font-weight="700" text-anchor="middle">02</text><text x="120" y="245" font-size="21" fill="#17201d" font-weight="700" >Session control</text><text x="120" y="272" font-size="16" fill="#52665b" font-weight="400" >Version negotiation, capabilities, manifest and explicit errors</text><text x="1138" y="247" font-size="11" fill="#52665b" font-weight="700" text-anchor="end">PROPOSED</text><rect x="40" y="307" width="1120" height="75" rx="10" fill="#ffffff" stroke="#c6d2c9"/><rect x="56" y="323" width="43" height="43" rx="7" fill="#e5f3d7" stroke="none"/><text x="78" y="351" font-size="17" fill="#365626" font-weight="700" text-anchor="middle">03</text><text x="120" y="336" font-size="21" fill="#17201d" font-weight="700" >Transfer engine</text><text x="120" y="363" font-size="16" fill="#52665b" font-weight="400" >Bounded data units, backpressure, cancellation and recovery</text><text x="1138" y="338" font-size="11" fill="#52665b" font-weight="700" text-anchor="end">PROPOSED</text><rect x="40" y="398" width="1120" height="75" rx="10" fill="#ffffff" stroke="#c6d2c9"/><rect x="56" y="414" width="43" height="43" rx="7" fill="#e5f3d7" stroke="none"/><text x="78" y="442" font-size="17" fill="#365626" font-weight="700" text-anchor="middle">04</text><text x="120" y="427" font-size="21" fill="#17201d" font-weight="700" >Integrity + durable state</text><text x="120" y="454" font-size="16" fill="#52665b" font-weight="400" >Verification, object binding and checkpoint acceptance</text><text x="1138" y="429" font-size="11" fill="#52665b" font-weight="700" text-anchor="end">UNDER RESEARCH</text><rect x="40" y="489" width="1120" height="75" rx="10" fill="#ffffff" stroke="#c6d2c9"/><rect x="56" y="505" width="43" height="43" rx="7" fill="#e5f3d7" stroke="none"/><text x="78" y="533" font-size="17" fill="#365626" font-weight="700" text-anchor="middle">05</text><text x="120" y="518" font-size="21" fill="#17201d" font-weight="700" >Transport integration</text><text x="120" y="545" font-size="16" fill="#52665b" font-weight="400" >Protected connection, peer identity and authorization policy</text><text x="1138" y="520" font-size="11" fill="#52665b" font-weight="700" text-anchor="end">UNDER RESEARCH</text><text x="40" y="627" font-size="17" fill="#52665b" font-weight="400" >No assigned wire format · No installable package · No conformance or performance claims</text>
</svg>
