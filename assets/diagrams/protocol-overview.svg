<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">GeneWire proposed M1 profile boundaries</title>
<desc id="desc">Five responsibility layers distinguish existing htsget and HTTPS wire behavior from proposed Rust policy, Python interface and independent analysis/evidence gates.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } path { stroke-linecap: round; stroke-linejoin: round; }</style>
<rect width="1280" height="780" fill="#f3f7f0"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527262"/></marker></defs>
<text x="40" y="48" font-size="30" fill="#17201d" font-weight="700" text-anchor="start">Profile and interoperability boundaries</text>
<text x="40" y="78" font-size="16" fill="#52665b" font-weight="400" text-anchor="start">Reuse upstream behavior; local contracts do not create a new binary network protocol.</text>
<rect x="1000" y="25" width="240" height="34" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="1120" y="48" font-size="12" fill="#3d6329" font-weight="700" text-anchor="middle">M2 REFERENCE / PRE-ALPHA</text>
<rect x="40" y="120" width="1200" height="90" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<rect x="56" y="140" width="44" height="46" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="78" y="170" font-size="18" fill="#3d6329" font-weight="700" text-anchor="middle">01</text>
<text x="122" y="154" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Existing regional request</text>
<text x="122" y="186" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">One named interval / BAM; other API features deferred</text>
<text x="1218" y="154" font-size="12" fill="#52665b" font-weight="700" text-anchor="end">UPSTREAM SUBSET</text>
<rect x="40" y="226" width="1200" height="90" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<rect x="56" y="246" width="44" height="46" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="78" y="276" font-size="18" fill="#3d6329" font-weight="700" text-anchor="middle">02</text>
<text x="122" y="260" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Existing ticket and data blocks</text>
<text x="122" y="292" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Ordered fragments over approved HTTPS or bounded inline data</text>
<text x="1218" y="260" font-size="12" fill="#52665b" font-weight="700" text-anchor="end">UPSTREAM WIRE</text>
<rect x="40" y="332" width="1200" height="90" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<rect x="56" y="352" width="44" height="46" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="78" y="382" font-size="18" fill="#3d6329" font-weight="700" text-anchor="middle">03</text>
<text x="122" y="366" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Rust client contract</text>
<text x="122" y="398" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Finite budgets, exposure-based retry and explicit failure</text>
<text x="1218" y="366" font-size="12" fill="#52665b" font-weight="700" text-anchor="end">PARTIAL LOCAL CORE</text>
<rect x="40" y="438" width="1200" height="90" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<rect x="56" y="458" width="44" height="46" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="78" y="488" font-size="18" fill="#3d6329" font-weight="700" text-anchor="middle">04</text>
<text x="122" y="472" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Python native boundary</text>
<text x="122" y="504" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Owned encoded-byte chunks, cancellation and explicit cleanup</text>
<text x="1218" y="472" font-size="12" fill="#52665b" font-weight="700" text-anchor="end">LOCAL PROTOTYPE</text>
<rect x="40" y="544" width="1200" height="90" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<rect x="56" y="564" width="44" height="46" rx="12" fill="#e5f3d7" stroke="#e5f3d7"/>
<text x="78" y="594" font-size="18" fill="#3d6329" font-weight="700" text-anchor="middle">05</text>
<text x="122" y="578" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Analysis and evidence</text>
<text x="122" y="610" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Decode/filter, process completion and independent oracle</text>
<text x="1218" y="578" font-size="12" fill="#52665b" font-weight="700" text-anchor="end">SEPARATE GATES</text>
<text x="40" y="706" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Output: upstream regional response, potentially a superset; exact selection belongs to a declared adapter.</text>
<text x="40" y="743" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Transport completion alone proves neither valid BAM nor absence of omitted records.</text>
</svg>
