<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">GeneWire conceptual transfer lifecycle</title><desc id="desc">Eight proposed stages from connection to closure, with repeated verification and checkpointing and a reconnect path that validates state before resuming.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } path,line { stroke-linecap: round; stroke-linejoin: round; }</style>
<rect x="0" y="0" width="1200" height="660" rx="0" fill="#f3f7f0" stroke="none"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527262"/></marker></defs><text x="40" y="52" font-size="30" fill="#17201d" font-weight="700" >Transfer lifecycle</text><text x="40" y="83" font-size="16" fill="#52665b" font-weight="400" >A proposed discussion sequence, not a normative state machine.</text><rect x="936" y="28" width="224" height="32" rx="6" fill="#e5f3d7" stroke="none"/><text x="1048" y="49" font-size="12" fill="#3e592c" font-weight="700" text-anchor="middle">CONCEPTUAL / PROPOSED</text><rect x="40" y="135" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="58" y="163" font-size="14" fill="#4b702f" font-weight="700" >01</text><text x="58" y="196" font-size="24" fill="#17201d" font-weight="700" >Connect</text><text x="58" y="230" font-size="16" fill="#52665b" font-weight="400" >Validate peer policy</text><line x1="290" y1="196" x2="330" y2="196" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="135" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="348" y="163" font-size="14" fill="#4b702f" font-weight="700" >02</text><text x="348" y="196" font-size="24" fill="#17201d" font-weight="700" >Negotiate</text><text x="348" y="230" font-size="16" fill="#52665b" font-weight="400" >Versions + limits</text><line x1="580" y1="196" x2="620" y2="196" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="135" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="638" y="163" font-size="14" fill="#4b702f" font-weight="700" >03</text><text x="638" y="196" font-size="24" fill="#17201d" font-weight="700" >Describe</text><text x="638" y="230" font-size="16" fill="#52665b" font-weight="400" >Objects + context</text><line x1="870" y1="196" x2="910" y2="196" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="910" y="135" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="928" y="163" font-size="14" fill="#4b702f" font-weight="700" >04</text><text x="928" y="196" font-size="24" fill="#17201d" font-weight="700" >Transfer</text><text x="928" y="230" font-size="16" fill="#52665b" font-weight="400" >Bounded data units</text><rect x="40" y="330" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="58" y="358" font-size="14" fill="#4b702f" font-weight="700" >05</text><text x="58" y="391" font-size="24" fill="#17201d" font-weight="700" >Verify</text><text x="58" y="425" font-size="16" fill="#52665b" font-weight="400" >Reject inconsistency</text><line x1="290" y1="391" x2="330" y2="391" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="330" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="348" y="358" font-size="14" fill="#4b702f" font-weight="700" >06</text><text x="348" y="391" font-size="24" fill="#17201d" font-weight="700" >Checkpoint</text><text x="348" y="425" font-size="16" fill="#52665b" font-weight="400" >Persist verified state</text><line x1="580" y1="391" x2="620" y2="391" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="330" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="638" y="358" font-size="14" fill="#4b702f" font-weight="700" >07</text><text x="638" y="391" font-size="24" fill="#17201d" font-weight="700" >Finalize</text><text x="638" y="425" font-size="16" fill="#52665b" font-weight="400" >Accept required objects</text><line x1="870" y1="391" x2="910" y2="391" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="910" y="330" width="250" height="122" rx="12" fill="#ffffff" stroke="#c6d2c9"/><text x="928" y="358" font-size="14" fill="#4b702f" font-weight="700" >08</text><text x="928" y="391" font-size="24" fill="#17201d" font-weight="700" >Close</text><text x="928" y="425" font-size="16" fill="#52665b" font-weight="400" >Release resources</text><path d="M1035 257 V294 H165 V330" fill="none" stroke="#527262" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="268" y="484" width="664" height="72" rx="10" fill="#e5f3d7" stroke="#c5d9b6"/><text x="600" y="512" font-size="15" fill="#365626" font-weight="700" text-anchor="middle">INTERRUPTED?</text><text x="600" y="540" font-size="17" fill="#365626" font-weight="400" text-anchor="middle">Reconnect → negotiate → validate checkpoint → resume transfer</text><text x="40" y="605" font-size="16" fill="#52665b" font-weight="400" >Verification and checkpointing would repeat during streaming; finalization requires complete acceptance.</text><text x="40" y="634" font-size="16" fill="#52665b" font-weight="400" >Recovery must reject stale, untrusted or object-mismatched state. Exact rules remain undecided.</text>
</svg>
