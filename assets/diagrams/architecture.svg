<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">GeneWire regional architecture and local M3 recovery layer</title>
<desc id="desc">Existing htsget services feed a policy-checked Rust stream engine and Python bridge. A supervised analysis consumer has a separate completion gate. The optional M3 job layer retains a SHA-256-pinned complete source, supports cooperative cancellation and serializes cancellation with output-link admission. A synced receipt recognizes publication after a crash; incomplete downloads restart without byte-offset resume.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } path { stroke-linecap: round; stroke-linejoin: round; }</style>
<rect width="1280" height="780" fill="#f3f7f0"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527262"/></marker></defs>
<text x="40" y="48" font-size="30" fill="#17201d" font-weight="700" text-anchor="start">Regional streaming architecture</text>
<text x="40" y="78" font-size="16" fill="#52665b" font-weight="400" text-anchor="start">M2 reference stream; optional local M3 verified-source recovery under qualification</text>
