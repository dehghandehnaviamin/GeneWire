<text x="450" y="387" font-size="20" fill="#17201d" font-weight="700" text-anchor="start">Exposure-based retry</text>
<text x="450" y="417" font-size="18" fill="#52665b" font-weight="400" text-anchor="start">Cancellation / task joins</text>
<text x="450" y="447" font-size="18" fill="#52665b" font-weight="400" text-anchor="start">Immutable terminal outcome</text>
<text x="450" y="494" font-size="16" fill="#52665b" font-weight="400" text-anchor="start">Tokio core; local evaluation only</text>
<rect x="900" y="155" width="340" height="175" rx="12" fill="#ffffff" stroke="#c6d2c9"/>
<text x="920" y="189" font-size="22" fill="#17201d" font-weight="700" text-anchor="start">Python bridge (local)</text>
<text x="920" y="221" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Owned byte chunks / typed errors</text>
<text x="920" y="247" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Synchronous pull reader</text>
<text x="920" y="273" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Explicit close and result report</text>
