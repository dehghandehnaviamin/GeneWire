<text x="640" y="102" font-size="14" fill="#52665b" font-weight="400" text-anchor="middle">Configured query using existing htsget</text>
<text x="40" y="584" font-size="17" fill="#3d6329" font-weight="700">Optional M3 job: pinned spool → cancellable analysis → publication fence → synced receipt (RFC 0002)</text>
<rect x="40" y="610" width="1200" height="100" rx="12" fill="#e5f3d7" stroke="#c6d2c9"/>
<text x="65" y="644" font-size="21" fill="#3d6329" font-weight="700" text-anchor="start">Transport complete</text>
<text x="65" y="676" font-size="16" fill="#3d6329" font-weight="400" text-anchor="start">Ordered bytes + HTTP checks</text>
<text x="475" y="644" font-size="21" fill="#3d6329" font-weight="700" text-anchor="start">Analysis complete</text>
<text x="475" y="676" font-size="16" fill="#3d6329" font-weight="400" text-anchor="start">Full consumer success</text>
<text x="875" y="644" font-size="21" fill="#3d6329" font-weight="700" text-anchor="start">Oracle matched</text>
<text x="875" y="676" font-size="16" fill="#3d6329" font-weight="400" text-anchor="start">Independent synthetic truth</text>
<text x="40" y="752" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">No byte-offset resume. M3 reuse requires a trusted digest; no power-loss or performance advantage claim.</text>
