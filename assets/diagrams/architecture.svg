<text x="430" y="196" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">HTTP + destination policy</text>
<text x="430" y="222" font-size="17" fill="#52665b" font-weight="400" text-anchor="start">Credential isolation / ticket checks</text>
<rect x="430" y="255" width="390" height="88" rx="12" fill="#e5f3d7" stroke="#c6d2c9"/>
<text x="450" y="288" font-size="21" fill="#3d6329" font-weight="700" text-anchor="start">Bounded encoded-byte stream</text>
